[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logprime"
version = "0.4.0"
description = "Exact, verifiable text encodings: a prime-number co-occurrence map, fixed-size sentence codes that decode with word order, and word vectors"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Campaner" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["embeddings", "nlp", "prime-numbers", "word-vectors"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
logprime = "logprime.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/lorenzocampaner/logprime"
Issues = "https://github.com/lorenzocampaner/logprime/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
